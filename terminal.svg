<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="900" height="589" viewBox="0 0 900 589" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
